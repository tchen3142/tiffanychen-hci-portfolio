<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Payment redesign: anonymized usability observations to design opportunities</title>
<desc id="desc">A visual synthesis of 2022 payment-app interview and usability research. Pain points are observed; suggestions are design opportunities, not validated outcomes.</desc>
<rect width="1200" height="560" rx="24" fill="#f8f9fc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="50" font-size="27" font-weight="700" fill="#283451">From observation to design opportunity</text>
<text x="42" y="80" font-size="17" fill="#62708b">Anonymized synthesis of team interviews and usability observations · 2022</text>
<text x="46" y="125" font-size="16" font-weight="700" fill="#47526c">WHAT USERS ENCOUNTERED</text>
<text x="650" y="125" font-size="16" font-weight="700" fill="#47526c">OPPORTUNITY FOR THE REDESIGN</text>
<g font-size="20">
<rect x="40" y="150" width="510" height="100" rx="16" fill="#e7ebf9"/>
<text x="66" y="191" font-weight="700" fill="#283e75">Payment action was hard to locate</text>
<text x="66" y="222" font-size="16" fill="#56688b">Observed navigation friction</text>
<path d="M562 198 H628 M614 187 l14 11 -14 11" fill="none" stroke="#7785a9" stroke-width="4"/>
<rect x="646" y="150" width="510" height="100" rx="16" fill="#e2f1eb"/>
<text x="672" y="192" font-weight="700" fill="#245f4d">Prioritize a visible primary action</text>
<text x="672" y="222" font-size="16" fill="#497d6c">Reduce competing controls</text>
<rect x="40" y="268" width="510" height="100" rx="16" fill="#e7ebf9"/>
<text x="66" y="309" font-weight="700" fill="#283e75">Unclear which account would be charged</text>
<text x="66" y="340" font-size="16" fill="#56688b">Funding-source uncertainty</text>
<path d="M562 316 H628 M614 305 l14 11 -14 11" fill="none" stroke="#7785a9" stroke-width="4"/>
<rect x="646" y="268" width="510" height="100" rx="16" fill="#e2f1eb"/>
<text x="672" y="310" font-weight="700" fill="#245f4d">Make the funding source explicit</text>
<text x="672" y="340" font-size="16" fill="#497d6c">Clarify before confirmation</text>
<rect x="40" y="386" width="510" height="100" rx="16" fill="#e7ebf9"/>
<text x="66" y="427" font-weight="700" fill="#283e75">Worry about accidental transfers</text>
<text x="66" y="458" font-size="16" fill="#56688b">Low confidence in error recovery</text>
<path d="M562 434 H628 M614 423 l14 11 -14 11" fill="none" stroke="#7785a9" stroke-width="4"/>
<rect x="646" y="386" width="510" height="100" rx="16" fill="#e2f1eb"/>
<text x="672" y="428" font-weight="700" fill="#245f4d">Review recipient and amount</text>
<text x="672" y="458" font-size="16" fill="#497d6c">Provide clear completion feedback</text>
</g>
<text x="42" y="531" font-size="14" fill="#65718d">Source: Final Redesign Presentation, slides 4–10 and 13–15 · Proposed changes were not validated with outcomes data</text>
</g></svg>