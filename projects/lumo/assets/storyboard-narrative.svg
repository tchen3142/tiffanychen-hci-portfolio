<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Lumo storyboard narrative: from confusion to an understandable conversation</title>
<desc id="desc">A reconstructed visual summary based on Lumo's original 2022 storyboard slides: the patient feels in the dark, encounters an intermediary, then sees translated conversation and bookmarks on a tablet. It is not an original storyboard frame.</desc>
<rect width="1200" height="410" rx="24" fill="#f7f8fd"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="38" y="43" fill="#273151" font-size="25" font-weight="700">Lumo · storyboard narrative</text>
<text x="38" y="70" fill="#58637c" font-size="15">Reconstructed visual summary based on the team's 2022 storyboard (not original frames)</text>
<rect x="36" y="92" width="360" height="264" rx="18" fill="#252a45"/>
<text x="58" y="126" font-size="19" font-weight="700" fill="#ffffff">01  In the dark</text>
<circle cx="211" cy="219" r="32" fill="#9aa6c5"/><path d="M155 301 Q158 245 211 255 Q264 245 267 301Z" fill="#9aa6c5"/>
<path d="M255 163 Q287 139 320 162" stroke="#c4cbe0" stroke-width="3" fill="none" stroke-dasharray="7 7"/>
<text x="57" y="329" fill="#dfe5f7" font-size="15">Uncertainty and limited voice</text>
<rect x="420" y="92" width="360" height="264" rx="18" fill="#e8e4f7"/>
<text x="441" y="126" font-size="19" font-weight="700" fill="#423a70">02  A communication barrier</text>
<circle cx="504" cy="193" r="24" fill="#b1a5d7"/><path d="M463 273 Q465 219 504 222 Q544 221 546 273Z" fill="#b1a5d7"/>
<circle cx="698" cy="193" r="24" fill="#8375b5"/><path d="M655 273 Q660 219 698 222 Q738 219 741 273Z" fill="#8375b5"/>
