<text x="443" y="329" fill="#5f527f" font-size="15">Questions rely on an intermediary</text>
<rect x="804" y="92" width="360" height="264" rx="18" fill="#e4f3ef"/>
<text x="825" y="126" font-size="19" font-weight="700" fill="#176356">03  A clearer exchange</text>
